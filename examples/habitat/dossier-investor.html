<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #F5F6F8; --surface: #FFFFFF; --ink: #172033; --muted: #5B6476; --faint: #8A93A5;
  --rule: #DCE1EA; --band: #EDF0F5; --accent: #2448B5;
  --s-accepted: #0E7C66; --s-rejected: #C2362B; --s-superseded: #6B4FD8; --s-parked: #B7791F; --s-proposed: #7A8499;
  --good: #0E7C66; --bad: #C2362B;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius-s: 4px; --radius-m: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121722; --surface: #1A2030; --ink: #E6EAF2; --muted: #A4ADBF; --faint: #7D879B;
    --rule: #2C3447; --band: #1F2638; --accent: #8FA8FF;
    --s-accepted: #3CC3A3; --s-rejected: #F0675C; --s-superseded: #A893FF; --s-parked: #E5B04B; --s-proposed: #8F99AE;
    --good: #3CC3A3; --bad: #F0675C;
  }
}
:root[data-theme="dark"] {
  --paper: #121722; --surface: #1A2030; --ink: #E6EAF2; --muted: #A4ADBF; --faint: #7D879B;
  --rule: #2C3447; --band: #1F2638; --accent: #8FA8FF;
  --s-accepted: #3CC3A3; --s-rejected: #F0675C; --s-superseded: #A893FF; --s-parked: #E5B04B; --s-proposed: #8F99AE;
  --good: #3CC3A3; --bad: #F0675C;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
img, svg { max-width: 100%; }

.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 48px; max-width: 1240px; margin: 0 auto; padding: 40px 28px 80px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 14px; }
nav.toc .toc-title { font-family: var(--display); font-weight: 700; font-size: 17px; margin: 0 0 14px; line-height: 1.25; }
nav.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
nav.toc a { display: block; padding: 5px 0 5px 14px; color: var(--muted); text-decoration: none; margin-left: -1px; border-left: 2px solid transparent; }
nav.toc a:hover { color: var(--ink); }
nav.toc a.active { color: var(--ink); border-left-color: var(--ink); }
.theme-btn { margin-top: 20px; background: none; border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 4px 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
main { min-width: 0; }

section.sec { padding: 44px 0 8px; border-top: 1px solid var(--rule); }
section.sec:first-child { border-top: 0; padding-top: 0; }
h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
.sec-lede { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }
h3 { font-family: var(--display); font-weight: 500; font-size: 19px; margin: 0 0 8px; }
p { max-width: 72ch; }
details.fold > summary { cursor: pointer; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2::after { content: " +"; color: var(--faint); font-weight: 500; }
details.fold[open] > summary h2::after { content: " −"; }

/* Hero */
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 7vw, 84px); line-height: 0.95; letter-spacing: -0.03em; margin: 0 0 18px; }
.hero .one-liner { font-size: clamp(19px, 2.2vw, 24px); line-height: 1.35; margin: 0 0 28px; max-width: 34ch; }
.stage-track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; max-width: 620px; margin: 0 0 10px; }
.stage-track .st { height: 6px; border-radius: 3px; background: var(--rule); }
.stage-track .st.done { background: var(--ink); }
.stage-labels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; max-width: 620px; font-size: 13px; color: var(--faint); }
.stage-labels .cur { color: var(--ink); font-weight: 600; }
.status-line { margin: 14px 0 32px; color: var(--muted); }
.highlights { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius-m); overflow: hidden; margin-bottom: 36px; }
.hl { background: var(--surface); padding: 16px 18px 14px; }
.hl .lab { font-size: 13px; color: var(--muted); }
.hl .val { font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1.1; margin: 4px 0 6px; }
.hl .val small { font-family: var(--body); font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.hl .range { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.frame-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px 36px; }
.frame-grid h3 { font-size: 16px; color: var(--muted); font-family: var(--body); font-weight: 600; margin-bottom: 4px; }
.frame-grid p { margin: 0; }
.tally { margin: 36px 0 0; }
.tally-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; max-width: 620px; background: var(--rule); }
.tally-bar span { display: block; height: 100%; }
.tally-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* Confidence glyph: solid = verified, hatched = estimated, hollow = assumption */
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.conf i { width: 11px; height: 11px; border-radius: 2px; border: 1.5px solid var(--ink); display: inline-block; flex: none; }
.conf.verified i { background: var(--ink); }
.conf.estimated i { background: repeating-linear-gradient(-45deg, var(--ink) 0 1.5px, transparent 1.5px 3.5px); }
.conf.assumption i { border-style: dashed; }
.conf:hover { color: var(--ink); }
.legend-row { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); margin: 0 0 18px; }
.legend-row .conf { cursor: default; }

.pop { position: absolute; z-index: 30; max-width: 320px; background: var(--ink); color: var(--paper); font-size: 13.5px; line-height: 1.45; padding: 10px 12px; border-radius: var(--radius-s); box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.pop b { display: block; margin-bottom: 2px; }

/* State pill */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 1px 8px 1px 6px; border-radius: 10px; border: 1px solid currentColor; line-height: 1.6; background: none; cursor: pointer; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.proposed::before { background: none; border: 1.5px dashed currentColor; width: 6px; height: 6px; }
.st-accepted { color: var(--s-accepted); } .st-rejected { color: var(--s-rejected); } .st-superseded { color: var(--s-superseded); }
.st-parked { color: var(--s-parked); } .st-proposed { color: var(--s-proposed); }

/* Filters */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 18px; }

/* River */
.river svg text { font-family: var(--body); }
.river .lane { cursor: pointer; }
.river .lane:hover .lane-bg, .river .lane:focus .lane-bg { fill: var(--band); }
.river .lane:focus { outline: none; }
.river .lane:focus .lane-bg { stroke: var(--accent); stroke-width: 1.5; }

/* Journey */
.journey { list-style: none; margin: 0; padding: 0; counter-reset: ch; }
.journey > li { position: relative; padding: 0 0 30px 44px; counter-increment: ch; }
.journey > li::before { content: counter(ch); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--paper); }
.journey > li::after { content: ""; position: absolute; left: 14px; top: 30px; bottom: 2px; width: 1.5px; background: var(--rule); }
.journey > li:last-child::after { display: none; }
.journey .date { font-size: 13px; color: var(--faint); }
.journey h3 { margin: 0 0 4px; }
.journey p { margin: 0 0 10px; }
.changes { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.changes li { display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 14px; }
.col h3 { font-size: 15px; font-family: var(--body); font-weight: 600; display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 2px solid currentColor; margin-bottom: 10px; }
.col .count { font-weight: 400; color: var(--faint); }
.card { color: var(--ink); display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 11px 12px; margin-bottom: 8px; cursor: pointer; }
.card:hover { border-color: var(--faint); }
.card .t { font-weight: 600; font-size: 15px; line-height: 1.3; }
.card .r { font-size: 13.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.card .hist { display: flex; gap: 3px; margin-top: 8px; }
.card .hist span { width: 14px; height: 4px; border-radius: 2px; background: currentColor; }
.col.cut .card .t { text-decoration: line-through; text-decoration-color: var(--faint); }

/* Two column lists */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.two h3 { display: flex; align-items: center; gap: 8px; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { padding: 10px 0; border-top: 1px solid var(--rule); }
.items li:first-child { border-top: 0; }
.items .why { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.mark { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--surface); flex: none; }
.weight { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: 1px; }
.weight span { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }

/* Costs */
.tabs { display: flex; gap: 4px; margin: 0 0 14px; border-bottom: 1px solid var(--rule); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.proj-ctl { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 4px 0 10px; font-size: 14.5px; }
.proj-ctl input[type=range] { width: 220px; accent-color: var(--ink); }
.proj-total { font-family: var(--display); font-size: 26px; font-weight: 700; }
.cat-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0; max-width: 520px; }
.cat-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }

/* Tech */
.stack { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius-m); overflow: hidden; }
.layer { display: grid; grid-template-columns: 130px 1fr; background: var(--surface); }
.layer .ln { padding: 14px; font-weight: 600; font-size: 14px; color: var(--muted); border-right: 1px solid var(--rule); text-transform: capitalize; }
.layer .lc { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tech-chip { border: 1.5px solid var(--s-accepted); border-radius: var(--radius-s); padding: 4px 10px; background: none; cursor: pointer; font-weight: 600; font-size: 14.5px; }
.tech-chip.later { border-style: dashed; }
.tech-chip small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.tech-alt { font-size: 13.5px; color: var(--faint); text-decoration: line-through; background: none; border: 0; cursor: pointer; padding: 0; }

/* Skills */
.skill-row { display: grid; grid-template-columns: minmax(130px, 220px) 120px 1fr auto; gap: 14px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.skill-row:first-child { border-top: 0; }
.meter { display: flex; gap: 4px; }
.meter span { width: 18px; height: 8px; border-radius: 2px; background: var(--rule); }
.meter span.on { background: var(--ink); }
.have { font-size: 12.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px; }
.have.yes { color: var(--good); border: 1px solid var(--good); }
.have.partial { color: var(--s-parked); border: 1px solid var(--s-parked); }
.have.no { color: var(--bad); border: 1px solid var(--bad); }
.skill-row .nf { color: var(--muted); font-size: 14px; }

/* Team */
.team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.role { display: flex; gap: 12px; align-items: flex-start; }
.people { display: flex; gap: 2px; flex-wrap: wrap; max-width: 80px; }
.role .why { color: var(--muted); font-size: 14px; }

/* Risks */
.risk-wrap { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 28px; align-items: start; }
.risk-list { list-style: none; margin: 0; padding: 0; }
.risk-list li { padding: 10px 8px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 26px 1fr; gap: 8px; border-radius: var(--radius-s); }
.risk-list li.hi { background: var(--band); }
.risk-list .n { font-weight: 700; }
.risk-list .mit { color: var(--muted); font-size: 14px; }

/* Questions */
.q { padding: 14px 0; border-top: 1px solid var(--rule); }
.q:first-child { border-top: 0; }
.q .qt { font-weight: 600; font-size: 16.5px; }
.q .wm { color: var(--muted); font-size: 14.5px; margin: 2px 0 6px; }
.q .blocks { font-size: 13.5px; color: var(--faint); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* Sources */
.src-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.src-table td, .src-table th { text-align: left; padding: 7px 10px 7px 0; border-top: 1px solid var(--rule); vertical-align: top; }
.src-table th { font-weight: 600; color: var(--muted); border-top: 0; }

/* Drawer */
dialog.drawer { margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(460px, 100vw); border: 0; padding: 0; background: var(--surface); color: var(--ink); box-shadow: -8px 0 40px rgba(0,0,0,.18); }
dialog.drawer::backdrop { background: rgba(10, 14, 22, .35); }
.drawer-in { padding: calc(env(safe-area-inset-top, 0px) + 24px) 26px calc(env(safe-area-inset-bottom, 0px) + 32px); }
.drawer-close { float: right; background: none; border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 3px 10px; cursor: pointer; }
.drawer h2 { font-size: 24px; margin: 6px 0 6px; padding-right: 60px; }
.drawer .meta { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.hist-list { list-style: none; padding: 0; margin: 0; }
.hist-list li { position: relative; padding: 0 0 20px 26px; }
.hist-list li::before { content: ""; position: absolute; left: 5px; top: 18px; bottom: 0; width: 1.5px; background: var(--rule); }
.hist-list li:last-child::before { display: none; }
.hist-list .hd { position: absolute; left: 0; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.hist-list .hd.proposed { background: none; border: 2px dashed currentColor; }
.hist-list .when { font-size: 13px; color: var(--faint); }
.hist-list .reason { margin-top: 2px; color: var(--ink); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }

.empty { color: var(--muted); padding: 60px 0; }
footer.foot { margin-top: 56px; color: var(--faint); font-size: 13px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding: 24px 18px 64px; }
  nav.toc { position: static; margin-bottom: 28px; }
  nav.toc ol { display: flex; flex-wrap: wrap; gap: 4px 14px; border: 0; }
  nav.toc a { padding: 2px 0; border: 0; }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .stage-labels { font-size: 11.5px; }
  .highlights { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two, .risk-wrap { grid-template-columns: 1fr; }
  .skill-row { grid-template-columns: 1fr auto; }
  .skill-row .nf { grid-column: 1 / -1; }
  .layer { grid-template-columns: 96px 1fr; }
}
@media (max-width: 520px) { .board { grid-template-columns: 1fr !important; } .hl .val { font-size: 26px; } }
@media (prefers-reduced-motion: no-preference) {
  .hero h1, .hero .one-liner { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .hero .one-liner { animation-delay: .08s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
}
@media print {
  nav.toc, .chips, .theme-btn, .tabs, .proj-ctl input { display: none !important; }
  .layout { display: block; padding: 0; }
  body { background: #fff; }
  section.sec { break-inside: avoid-page; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="toc" aria-label="Sections"><p class="toc-title" id="toc-title"></p><ol id="toc"></ol><button class="theme-btn" id="theme-btn" type="button">Switch theme</button></nav>
  <main id="main"></main>
</div>
<dialog class="drawer" id="drawer" aria-labelledby="drawer-title"><div class="drawer-in" id="drawer-in"></div></dialog>

builders.costs = (C) => {
  const items = C.items || [];
  const kinds = [["monthly", "Monthly"], ["one_time", "One-time"], ["yearly", "Yearly"]].filter(([k]) => items.some((i) => i.kind === k));
  const CATS = ["infra", "tools", "people", "marketing", "legal", "hardware", "other"];
  const catColor = (c) => ({ infra: "#2448B5", tools: "#0E7C66", people: "#6B4FD8", marketing: "#B7791F", legal: "#C2362B", hardware: "#3A7CA5", other: "#7A8499" })[CATS.includes(c) ? c : "other"];
  const out = h("div", {}, confLegend());
  const tabs = h("div", { class: "tabs", role: "tablist" });
  const pane = h("div", { class: "panel scroll-x", role: "tabpanel" });
  function drawKind(kind) {
    const list = items.filter((i) => i.kind === kind).sort((a, b) => (b.high || b.value) - (a.high || a.value));
    const max = Math.max(1, ...list.map((i) => i.high != null ? i.high : i.value));
    const LW = 250, W = 900, RH = 40, H = list.length * RH + 30;

    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": `${kind} costs` });
    const ink = css("--ink");
    list.forEach((it, i) => {
      const y = i * RH + 8;
      const col = catColor(it.category);
      const fillFor = confDefs(svg, col);
      svg.append(s("text", { x: 4, y: y + 15, "font-size": 14, fill: ink, text: it.label.length > 32 ? it.label.slice(0, 31) + "…" : it.label }, s("title", { text: it.label })));
      svg.append(s("text", { x: 4, y: y + 30, "font-size": 11.5, fill: css("--muted"), text: `${it.category || "other"}, ${(CONF_TEXT[it.confidence] || "Assumption").toLowerCase()}` }));
      if (it.low != null && it.high != null) svg.append(s("rect", { x: x(it.low), y: y + 13, width: Math.max(2, x(it.high) - x(it.low)), height: 6, rx: 3, fill: col, opacity: 0.22 }));
      svg.append(s("rect", Object.assign({ x: LW, y: y + 6, width: Math.max(2, x(it.value) - LW), height: 20, rx: 3, "stroke-width": 1.5 }, fillFor(it.confidence))));
      svg.append(s("text", { x: x(Math.max(it.value, it.high || 0)) + 8, y: y + 21, "font-size": 13.5, "font-weight": 600, fill: ink, text: money(it.value) + (it.low != null && it.high != null ? `  (${money(it.low)}–${money(it.high)})` : "") }));
    });
    const table = h("ul", { class: "items", style: "margin-top:12px" }, list.map((it) => h("li", { style: "display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap" },
      h("span", {}, h("span", { class: "dot", style: `background:${catColor(it.category)}` }), it.label), confBadge(it))));
    pane.replaceChildren(svg, table);
  }
  kinds.forEach(([k, label], i) => tabs.append(h("button", { class: "tab", role: "tab", type: "button", "aria-selected": i === 0 ? "true" : "false", onclick: (e) => { tabs.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", "false")); e.currentTarget.setAttribute("aria-selected", "true"); drawKind(k); } }, label)));
  if (kinds.length > 1) out.append(tabs);
  out.append(pane);
  if (kinds.length) drawKind(kinds[0][0]);

  // cumulative projection
  const totalAt = (m, field) => items.reduce((a, it) => {
    const v = field === "low" ? (it.low != null ? it.low : it.value) : field === "high" ? (it.high != null ? it.high : it.value) : it.value;
    return a + (it.kind === "one_time" ? v : it.kind === "monthly" ? v * m : it.kind === "yearly" ? v * Math.ceil(m / 12) : 0);
  }, 0);
  const proj = h("div", { style: "margin-top:34px" }, h("h3", { text: "What it adds up to" }));
  const ctl = h("div", { class: "proj-ctl" });
  const slider = h("input", { type: "range", min: 1, max: 36, value: 12, "aria-label": "Months" });
  const mLabel = h("span", {}), total = h("span", { class: "proj-total" }), rng = h("span", { style: "color:var(--muted)" });
  ctl.append(h("label", {}, "After ", mLabel, " ", slider), total, rng);
  const chartHolder = h("div", { class: "panel scroll-x" });
  const catBar = h("div", { class: "cat-bar" }), catLeg = h("div", { class: "cat-legend" });
  function drawProj() {
    const M = +slider.value;
    mLabel.textContent = M === 1 ? "1 month" : M + " months";
    total.textContent = money(totalAt(M, "value"));
    const lo = totalAt(M, "low"), hi = totalAt(M, "high");
    rng.textContent = lo !== hi ? `range ${money(lo)} to ${money(hi)}` : "";

    const maxV = stepV * 4;
    const x = (m) => L + (W - L - R) * (m / 36), y = (v) => T + (H - T - B) * (1 - v / maxV);
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": "Cumulative cost over 36 months" });
    for (let k = 0; k <= 4; k++) { const v = maxV * k / 4; svg.append(s("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: css("--rule") })); svg.append(s("text", { x: L - 8, y: y(v) + 4, "font-size": 11, fill: css("--faint"), "text-anchor": "end", text: money(v) })); }
    [0, 6, 12, 18, 24, 30, 36].forEach((m) => svg.append(s("text", { x: x(m), y: H - 8, "font-size": 11, fill: css("--faint"), "text-anchor": "middle", text: m ? m + " mo" : "Start" })));
    let band = "", line = "";

    svg.append(s("line", { x1: x(M), x2: x(M), y1: T, y2: H - B, stroke: css("--accent"), "stroke-width": 1.5, "stroke-dasharray": "4 3" }));
    svg.append(s("circle", { cx: x(M), cy: y(totalAt(M, "value")), r: 5, fill: css("--accent") }));
    chartHolder.replaceChildren(svg);
    const byCat = {}; items.forEach((it) => { const v = it.kind === "one_time" ? it.value : it.kind === "monthly" ? it.value * M : it.kind === "yearly" ? it.value * Math.ceil(M / 12) : 0; byCat[it.category || "other"] = (byCat[it.category || "other"] || 0) + v; });
    const tot = Object.values(byCat).reduce((a, b) => a + b, 0) || 1;

    catLeg.replaceChildren(...cats.map((c) => h("span", {}, h("span", { class: "dot", style: `background:${catColor(c)}` }), `${c} ${money(byCat[c])}`)));
  }
  slider.addEventListener("input", drawProj);
  proj.append(ctl, catBar, catLeg, h("div", { style: "height:12px" }), chartHolder);

  return { lede: C.note || "", node: out };
};

builders.tech = (T) => {
  const tech = decisions.filter((d) => d.area === "tech");
  const order = ["frontend", "mobile", "backend", "ai", "data", "infra", "tooling"];
  const layers = [...new Set(tech.filter((d) => d.current_state === "accepted").map((d) => d.layer || "other"))].sort((a, b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b)));
  const stack = h("div", { class: "stack" }, layers.map((L) => h("div", { class: "layer" },
    h("div", { class: "ln", text: L }),
    h("div", { class: "lc" }, tech.filter((d) => (d.layer || "other") === L && d.current_state === "accepted").map((d) => {
      const alts = tech.filter((a) => a.superseded_by === d.id || ((a.layer || "other") === L && a.current_state === "rejected"));
      return [h("button", { class: "tech-chip" + (d.phase === "later" ? " later" : ""), type: "button", onclick: () => openDecision(d.id) }, d.title, d.phase === "later" ? h("small", { text: "later" }) : null),
        ...alts.map((a) => h("button", { class: "tech-alt", type: "button", onclick: () => openDecision(a.id), title: lastReason(a) }, a.title))];
    })))));
  return { lede: (T && T.intro ? T.intro + " " : "") + "Struck-through names are options that were considered and dropped; select any to see why.", node: stack };
};

builders.skills = (K) => {
  const items = K.items || [];
  const gaps = items.filter((i) => i.have === "no").length, part = items.filter((i) => i.have === "partial").length;
  const rows = h("div", { class: "panel" }, items.slice().sort((a, b) => b.level - a.level).map((k) => h("div", { class: "skill-row" },
    h("strong", { text: k.name }),
    h("div", { class: "meter", role: "img", "aria-label": `Level ${k.level} of 5` }, [1, 2, 3, 4, 5].map((n) => h("span", { class: n <= k.level ? "on" : "" }))),
    h("span", { class: "nf", text: k.needed_for || "" }),

  return { lede: `Bars show the level needed, from basic to expert. ${gaps ? gaps + " gap" + (gaps > 1 ? "s" : "") : "No gaps"}${part ? ", " + part + " partly covered" : ""}.`, node: rows };
};

builders.team = (T) => {

  const total = roles.reduce((a, r) => a + (r.count || 1), 0);
  const person = (filled) => { const v = s("svg", { viewBox: "0 0 16 20", width: 16, height: 20, "aria-hidden": "true" }); v.append(s("circle", { cx: 8, cy: 5, r: 4, fill: filled ? css("--ink") : "none", stroke: css("--ink"), "stroke-width": 1.4 }), s("path", { d: "M1 19 C1 12, 15 12, 15 19 Z", fill: filled ? css("--ink") : "none", stroke: css("--ink"), "stroke-width": 1.4 })); return v; };
  const phases = [["mvp", "For the MVP"], ["later", "After the MVP"]];
  const grid = h("div", { class: "two" }, phases.map(([p, title]) => {
    const list = roles.filter((r) => r.phase === p || r.phase === "both" || (!r.phase && p === "mvp"));
    return h("div", {}, h("h3", { text: title }), list.length ? h("div", { class: "team-grid", style: "grid-template-columns:1fr" }, list.map((r) => h("div", { class: "role" },
      h("div", { class: "people" }, Array.from({ length: r.count || 1 }, () => person(r.essential !== false))),
      h("div", {}, h("strong", { text: `${r.role}${(r.count || 1) > 1 ? " ×" + r.count : ""}` }), r.essential === false ? h("span", { class: "why", text: "  optional" }) : null, r.why ? h("div", { class: "why", text: r.why }) : null)))) : h("p", { class: "why", text: "No roles needed." }));
  }));
  return { lede: (T.note ? T.note + " " : "") + `${total} ${total === 1 ? "person" : "people"} across all phases. Hollow figures are optional roles.`, node: grid };
};

builders.risks = (R) => {
  const items = R.items || [];
  const list = h("ol", { class: "risk-list" });
  const S = 300, P = 40, cell = (S - P) / 3;
  const svg = s("svg", { viewBox: `0 0 ${S + 10} ${S + 30}`, width: "100%", role: "img", "aria-label": "Risk matrix, likelihood by impact" });
  for (let li = 1; li <= 3; li++) for (let im = 1; im <= 3; im++) {
    const score = li * im;
    svg.append(s("rect", { x: P + (li - 1) * cell, y: (3 - im) * cell, width: cell - 3, height: cell - 3, rx: 4, fill: css("--bad"), opacity: 0.06 + score * 0.055 }));
  }
  svg.append(s("text", { x: P + (S - P) / 2, y: S + 6, "font-size": 12, "text-anchor": "middle", fill: css("--muted"), text: "Likelihood →" }));
  svg.append(s("text", { x: 12, y: (S - P) / 2, "font-size": 12, "text-anchor": "middle", fill: css("--muted"), transform: `rotate(-90 12 ${(S - P) / 2})`, text: "Impact →" }));
  const buckets = {};
  const marks = [];
  const sizes = {}; items.forEach((r) => { const key = r.likelihood + "-" + r.impact; sizes[key] = (sizes[key] || 0) + 1; });
  items.forEach((r, i) => {
    const key = r.likelihood + "-" + r.impact; const k = buckets[key] = (buckets[key] || 0) + 1;
    const n = sizes[key], perRow = Math.min(3, n), row = Math.floor((k - 1) / 3), col = (k - 1) % 3;
    const rowCount = Math.min(3, n - row * 3), rows = Math.ceil(n / 3);
    const cx = P + (r.likelihood - 1) * cell + cell / 2 + (col - (rowCount - 1) / 2) * 24 - 1.5;
    const cy = (3 - r.impact) * cell + cell / 2 + (row - (rows - 1) / 2) * 24 - 1.5;
    const g = s("g", { tabindex: 0, role: "button", "aria-label": `Risk ${i + 1}: ${r.text}`, style: "cursor:pointer" });
    const closed = r.status === "mitigated" || r.status === "closed";
    g.append(s("circle", { cx, cy, r: 11, fill: closed ? css("--surface") : css("--ink"), stroke: css("--ink"), "stroke-width": 1.6 }));
    g.append(s("text", { x: cx, y: cy + 4, "font-size": 11.5, "font-weight": 700, "text-anchor": "middle", fill: closed ? css("--ink") : css("--paper"), text: i + 1 }));
    const li = h("li", {}, h("span", { class: "n", text: i + 1 }), h("div", {}, h("div", { text: r.text }), r.mitigation ? h("div", { class: "mit", text: "Mitigation: " + r.mitigation }) : null, h("div", { class: "mit" }, `Likelihood ${r.likelihood} of 3, impact ${r.impact} of 3${r.status ? ", " + r.status : ""}`)));
    const hi = (on) => { li.classList.toggle("hi", on); };
    g.addEventListener("mouseenter", () => hi(true)); g.addEventListener("mouseleave", () => hi(false));
    g.addEventListener("focus", () => hi(true)); g.addEventListener("blur", () => hi(false));
    g.addEventListener("click", () => li.scrollIntoView({ block: "nearest", behavior: "smooth" }));
    svg.append(g); list.append(li);
  });
  return { lede: "Top right is the danger zone. Filled markers are open risks; hollow ones are mitigated or closed.", node: h("div", { class: "risk-wrap" }, h("div", {}, svg), list) };
};

builders.open_questions = (Q) => {
  const list = h("div", { class: "panel" }, Q.map((q) => h("div", { class: "q" },
    h("div", { class: "qt", text: q.text }),
    q.why_it_matters ? h("div", { class: "wm", text: q.why_it_matters }) : null,
    (q.blocks || []).length || q.owner ? h("div", { class: "blocks" }, (q.blocks || []).length ? "Waiting on this:" : null,
      ...(q.blocks || []).filter((id) => decById[id]).map((id) => h("button", { class: "linkish", type: "button", onclick: () => openDecision(id) }, decById[id].title)),
      q.owner ? h("span", {}, "Owner: " + q.owner) : null) : null)));

builders.sources = (S) => {
  const dated = S.filter((x) => parseDate(x.started) != null);
  let strip = null;
  if (dated.length > 1) {
    const t0 = Math.min(...dated.map((x) => parseDate(x.started))), t1 = Math.max(...dated.map((x) => parseDate(x.ended || x.started)));
    const W = 900, RH = 22, H = dated.length * RH + 24, L = 50, RPAD = 150;
    const x = (t) => L + (W - L - RPAD) * ((t - t0) / Math.max(1, t1 - t0));
    strip = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": "When each source happened" });
    dated.forEach((so, i) => {
      const a = x(parseDate(so.started)), b = x(parseDate(so.ended || so.started));
      strip.append(s("text", { x: 0, y: i * RH + 13, "font-size": 12, fill: css("--muted"), text: so.id }));
      strip.append(s("rect", { x: a, y: i * RH + 5, width: Math.max(12, b - a), height: 10, rx: 5, fill: css("--ink"), opacity: 0.75 }, s("title", { text: `${so.tool}: ${so.title}` })));
      strip.append(s("text", { x: a + Math.max(12, b - a) + 8, y: i * RH + 14, "font-size": 12, fill: css("--muted"), text: so.tool }));
    });
    strip.append(s("text", { x: L, y: H - 4, "font-size": 11, fill: css("--faint"), text: fmtShort(t0) }));
    strip.append(s("text", { x: W - RPAD, y: H - 4, "font-size": 11, fill: css("--faint"), "text-anchor": "end", text: fmtShort(t1) }));
  }
  const table = h("table", { class: "src-table" }, h("thead", {}, h("tr", {}, ["", "Tool", "Conversation", "When", "Messages"].map((t) => h("th", { text: t })))),
    h("tbody", {}, S.map((so) => h("tr", {}, h("td", { text: so.id }), h("td", { text: so.tool }), h("td", { text: so.title }), h("td", { text: [fmtDate(so.started), so.ended && so.ended !== so.started ? fmtDate(so.ended) : null].filter(Boolean).join(" to ") }), h("td", { text: so.messages != null ? so.messages : "" })))));
  return { lede: "Everything in this dossier traces back to these conversations.", node: h("div", {}, strip ? h("div", { class: "scroll-x", style: "margin-bottom:16px" }, strip) : null, h("div", { class: "scroll-x" }, table)) };
};

/* ---------- assemble ---------- */
const meta = D.meta || {};
document.title = meta.title || (D.summary && D.summary.name) || "Idea dossier";
document.getElementById("toc-title").textContent = (D.summary && D.summary.name) || meta.title || "Dossier";
const defaultOrder = ["summary", "journey", "decisions", "features", "plan", "costs", "tech", "skills", "team", "dos_donts", "risks", "validation", "pros_cons", "open_questions", "sources"];
const order = (meta.section_order && meta.section_order.length ? meta.section_order : defaultOrder).filter((k) => D[k] != null && builders[k]);
const collapsed = new Set(meta.collapsed || []);
const toc = document.getElementById("toc");
const redraws = [];
order.forEach((key) => {
  const val = D[key];
  if (Array.isArray(val) && !val.length) return;
  let built;
  try { built = builders[key](val); } catch (err) { console.error(key, err); return; }
  const id = "s-" + key;
  const sec = h("section", { class: "sec", id, "aria-labelledby": id + "-h" });
  if (built.bare) { sec.append(built.node); }
  else {
    const head = [h("h2", { id: id + "-h", text: TITLES[key] }), built.lede ? h("p", { class: "sec-lede", text: built.lede }) : null];
    const headNodes = head.filter(Boolean);
    if (collapsed.has(key)) sec.append(h("details", { class: "fold" }, h("summary", {}, ...headNodes), built.node));
    else sec.append(...headNodes, built.node);
  }
  if (built.node._redraw) redraws.push(built.node._redraw);
  main.append(sec);
  toc.append(h("li", {}, h("a", { href: "#" + id, text: TITLES[key] })));
});
main.append(h("footer", { class: "foot" }, `Compiled ${fmtDate(meta.generated)} from a decision ledger${(D.sources || []).length ? " and " + D.sources.length + " source" + (D.sources.length === 1 ? "" : "s") : ""}.${meta.audience ? " Prepared for: " + meta.audience + "." : ""}`));

/* active nav */
const links = [...toc.querySelectorAll("a")];
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) links.forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id)); }), { rootMargin: "-30% 0px -60% 0px" });
  main.querySelectorAll("section.sec").forEach((sct) => io.observe(sct));
}

/* theme toggle: redraw SVGs that read CSS colors */
const root = document.documentElement;
try { const saved = localStorage.getItem("dossier-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
document.getElementById("theme-btn").addEventListener("click", () => {
  const dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("dossier-theme", next); } catch (e) {}
  redraws.forEach((f) => f());
  rebuildStatic();
});
function rebuildStatic() {
  // sections without redraw hooks use colors read at build time; rebuild them in place
  order.forEach((key) => {
    const sec = document.getElementById("s-" + key); if (!sec) return;
    if (["plan", "risks", "sources", "validation", "team"].includes(key)) {
      const built = builders[key](D[key]);
      const old = sec.querySelector("details.fold") ? sec.querySelector("details.fold").lastElementChild : sec.lastElementChild;
      old.replaceWith(built.node);
    }
  });
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!root.getAttribute("data-theme")) { redraws.forEach((f) => f()); rebuildStatic(); } });
})();
</script>
